# 去广告合集（多屏互动 + 小白智慧打印）—— Quantumult X
# 由可莉 https://github.com/luestr/ProxyResource 的 Loon 插件转换，已去掉夸克部分
# 对应仓库里的 Rewrite/kelee.sgmodule（Surge 版），脚本：Rewrite/kelee_remove_ads.js
# 原作者：可莉 · 转换：isw866
#
# 用法：QX → 设置 → 配置文件 → 编辑，把下面三段贴进去；
#       再在 设置 → MitM 生成证书、安装并信任，最后开启 MitM。
# 说明：以「重写资源」URL 导入时，QX 只读取 [rewrite_local] 与 [mitm]，
#       [filter_local] 两行需另行加到主配置。

[filter_local]
host, ad.lovefree.cc, reject
host-suffix, adwanji.com, reject

[rewrite_local]
# 多屏互动 tcast：配置接口只保留 module == "tools" 的项
^https://tcast-o\.api\.leiniao\.com/tcast/v\d/config/function\? url script-response-body https://raw.githubusercontent.com/isw866/qx/refs/heads/main/Rewrite/kelee_remove_ads.js
# 小白智慧打印 epbox：删 mallConsumables / goodsCoupons / systemConfig，并过滤楼层
^https://epbox\.gongfudou\.com/graphql$ url script-response-body https://raw.githubusercontent.com/isw866/qx/refs/heads/main/Rewrite/kelee_remove_ads.js
# 原 [Map Local] 直接返回 {} 的 9 条，QX 用 reject-dict（200 + 空 JSON）
^https://tcast-o\.api\.leiniao\.com/tcast/ads/ url reject-dict
^https://tcast-o\.api\.leiniao\.com/tcast/v\d/selection/banner$ url reject-dict
^https://tcast-o\.api\.leiniao\.com/tcast/v\d/searchrank$ url reject-dict
^https://tcast-o\.api\.leiniao\.com/tcast/v\d/selection\? url reject-dict
^https://tcast-o\.api\.leiniao\.com/tcast/message/v\d/activity\? url reject-dict
^https://epbox\.gongfudou\.com/big_data/v\d/banners\? url reject-dict
^https://epbox\.gongfudou\.com/big_data/v\d/canvas/query_actions\? url reject-dict
^https://stars\.shuqireader\.com/kkios/render/load/resource/app$ url reject-dict
^https://stars\.shuqireader\.com/kkios/render/load/resource/appConfig$ url reject-dict

[mitm]
hostname = %APPEND% tcast-o.api.leiniao.com, epbox.gongfudou.com, stars.shuqireader.com
